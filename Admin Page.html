<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Console | Biometric Attendance</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #FF6B00; --dark: #0f172a; --bg: #f8fafc; --white: #ffffff; }
        body { background-color: var(--bg); font-family: 'Outfit', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }

        .sidebar { width: 280px; background-color: var(--dark); color: white; padding: 30px 20px; display: flex; flex-direction: column; }
        .sidebar h2 { font-size: 22px; margin-bottom: 40px; color: var(--primary); font-weight: 800; }
        .nav-item { padding: 15px; border-radius: 12px; cursor: pointer; margin-bottom: 8px; color: #94a3b8; font-weight: 600; transition: 0.3s; }
        .nav-item.active { background-color: var(--primary); color: white; }

        .main-content { flex: 1; padding: 40px; overflow-y: auto; }
        .content-section { display: none; }
        .content-section.active { display: block; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 25px; border-radius: 20px; border: 1px solid #e2e8f0; }
        .stat-card h3 { margin: 0; font-size: 13px; color: #64748b; text-transform: uppercase; }
        .stat-card .value { font-size: 32px; font-weight: 800; color: var(--dark); margin-top: 10px; }

        .card-container { background: white; border-radius: 24px; padding: 30px; border: 1px solid #e2e8f0; }
        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .search-bar { padding: 12px 18px; border: 2px solid #f1f5f9; border-radius: 12px; width: 320px; }

        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 15px; border-bottom: 1px solid #f1f5f9; }
        th { color: #64748b; font-size: 12px; text-transform: uppercase; font-weight: 800; }
        .badge { padding: 6px 14px; border-radius: 30px; font-size: 12px; font-weight: 700; background: #fff7ed; color: var(--primary); }
        .badge-success { background: #dcfce7; color: #166534; }
        
        /* SETTINGS GRID */
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 750px; }
        .setting-group { margin-bottom: 20px; }
        .full-row { grid-column: span 2; }
        .setting-group label { display: block; font-weight: 700; color: var(--dark); margin-bottom: 10px; font-size: 14px; text-transform: uppercase; }
        .setting-group input, .setting-group select { width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #e2e8f0; background: #f8fafc; font-family: inherit; }

        .export-btn { background: #10b981; color: white; border: none; padding: 12px 25px; border-radius: 10px; cursor: pointer; font-weight: 700; }
        .btn-logout { background: #ef4444; color: white; border: none; padding: 12px; border-radius: 12px; cursor: pointer; font-weight: 700; width: 100%; margin-top: auto; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Admin Console</h2>
        <div class="nav-item active" onclick="switchSection('directory', this)">Student Directory</div>
        <div class="nav-item" onclick="switchSection('logs', this)">Attendance Logs</div>
        <div class="nav-item" onclick="switchSection('settings', this)">System Settings</div>
        <button class="btn-logout" onclick="location.href='index.html'">Logout</button>
    </div>

    <div class="main-content">
        <div id="directory" class="content-section active">
            <div class="header"><h1>User Management</h1></div>
            <div class="stats-grid">
                <div class="stat-card"><h3>Total Students</h3><div class="value" id="stat-total">0</div></div>
                <div class="stat-card"><h3>Cyber Dept.</h3><div class="value" id="stat-cyber">0</div></div>
                <div class="stat-card"><h3>AR VR Dept.</h3><div class="value" id="stat-arvr">0</div></div>
            </div>
            <div class="card-container">
                <div class="table-header"><h3>Registered Accounts</h3><input type="text" class="search-bar" id="search-students" placeholder="Search students..."></div>
                <table><thead><tr><th>Full Name</th><th>Email ID</th><th>Branch</th><th>Registered</th></tr></thead><tbody id="student-table-body"></tbody></table>
            </div>
        </div>

        <div id="logs" class="content-section">
            <div class="header"><h1>Attendance History</h1></div>
            <div class="card-container">
                <div class="table-header"><h3>Facial Scan Logs (Live)</h3><button class="export-btn" id="exportCSV">Download CSV Report</button></div>
                <table><thead><tr><th>Student Name</th><th>Lecture</th><th>Time Log</th><th>Verification</th></tr></thead><tbody id="logs-table-body"></tbody></table>
            </div>
        </div>

        <div id="settings" class="content-section">
            <div class="header"><h1>Portal Settings</h1></div>
            <div class="card-container">
                <div class="settings-grid">
                    <div class="setting-group full-row"><label>Campus Name</label><input type="text" value="ADYPU Chakan Biometric Center"></div>
                    <div class="setting-group"><label>Threshold (%)</label><input type="number" value="75"></div>
                    <div class="setting-group"><label>Scanner Sensitivity</label><select><option>High Precision</option><option selected>Optimized</option></select></div>
                    <div class="setting-group"><label>System Mode</label><select><option selected>Live Monitoring</option><option>Maintenance Mode</option></select></div>
                    <div class="setting-group"><label>Admin Alert Email</label><input type="email" value="admin@adypu.edu"></div>
                </div>
                <button style="background:var(--primary); color:white; border:none; padding:15px 35px; border-radius:12px; font-weight:700; cursor:pointer;">UPDATE SETTINGS</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        const firebaseConfig = { apiKey: "AIzaSyBogJqcO9IifIIQrgS7iDQeYPF22XtXnEc", authDomain: "student-attendance-syste-36412.firebaseapp.com", projectId: "student-attendance-syste-36412", storageBucket: "student-attendance-syste-36412.firebasestorage.app", messagingSenderId: "183007048528", appId: "1:183007048528:web:5bcade6da140f369013255", measurementId: "G-RXGBW49ZB3" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let exportData = [];

        window.switchSection = (id, el) => {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active'); el.classList.add('active');
        };

        async function loadData() {
            const dirBody = document.getElementById('student-table-body');
            const logsBody = document.getElementById('logs-table-body');
            
            const qDir = query(collection(db, "students"), orderBy("registeredAt", "desc"));
            const snapDir = await getDocs(qDir);
            let cyber = 0, arvr = 0;
            dirBody.innerHTML = "";
            snapDir.forEach(doc => {
                const d = doc.data();
                if(d.branch.includes("Cyber")) cyber++; else arvr++;
                dirBody.innerHTML += `<tr><td><strong>${d.name}</strong></td><td>${d.email}</td><td><span class="badge badge-orange">${d.branch}</span></td><td>${d.registeredAt.toDate().toLocaleDateString()}</td></tr>`;
            });
            document.getElementById('stat-total').innerText = snapDir.size;
            document.getElementById('stat-cyber').innerText = cyber;
            document.getElementById('stat-arvr').innerText = arvr;

            const qLogs = query(collection(db, "attendance_logs"), orderBy("timestamp", "desc"));
            const snapLogs = await getDocs(qLogs);
            logsBody.innerHTML = "";
            exportData = [];
            snapLogs.forEach(doc => {
                const d = doc.data();
                const time = d.timestamp.toDate().toLocaleString();
                exportData.push({ Name: d.name, Lecture: d.lecture, Time: time });
                logsBody.innerHTML += `<tr><td><strong>${d.name}</strong></td><td>${d.lecture}</td><td>${time}</td><td><span class="badge badge-success">VERIFIED</span></td></tr>`;
            });
        }

        document.getElementById('exportCSV').addEventListener('click', () => {
            const csv = [["Name", "Lecture", "Time"], ...exportData.map(r => [r.Name, r.Lecture, r.Time])].map(e => e.join(",")).join("\n");
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = "Attendance_Report.csv"; a.click();
        });

        loadData();
    </script>
</body>
</html>
