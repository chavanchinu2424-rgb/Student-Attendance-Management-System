<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biometric Attendance - Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; background-image: radial-gradient(circle at top right, #e2e8f0 0%, #f0f2f5 100%); font-family: 'Outfit', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .portal-container { display: flex; width: 1000px; height: 600px; background-color: #ffffff; border-radius: 24px; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15); overflow: hidden; }
        .branding-panel { flex: 1; background: linear-gradient(135deg, #0f172a 0%, #000000 100%); color: white; padding: 60px; display: flex; flex-direction: column; justify-content: center; position: relative; overflow: hidden; }
        .brand-name { font-size: 42px; font-weight: 800; margin: 0; line-height: 1.1; }
        .brand-name span { color: #FF6B00; }
        .form-panel { flex: 1; padding: 60px; display: flex; flex-direction: column; justify-content: center; }
        .input-group { margin-bottom: 24px; display: flex; flex-direction: column; }
        .input-group label { font-size: 14px; font-weight: 600; color: #334155; margin-bottom: 10px; text-transform: uppercase; }
        .input-group input { padding: 16px 20px; border: 2px solid #e2e8f0; border-radius: 12px; font-size: 16px; background-color: #f8fafc; }
        .login-btn { background: linear-gradient(135deg, #FF8A00 0%, #FF6B00 100%); color: white; border: none; padding: 18px; border-radius: 12px; font-size: 18px; font-weight: 600; cursor: pointer; box-shadow: 0 10px 25px rgba(255, 107, 0, 0.3); width: 100%; }
        .footer-links { text-align: center; margin-top: 24px; }
        .footer-links a { display: block; color: #64748b; font-size: 15px; text-decoration: none; font-weight: 600; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="portal-container">
        <div class="branding-panel">
            <h1 class="brand-name">Biometric<br><span>Attendance</span></h1>
            <p style="font-size: 18px; color: #94a3b8; margin-top: 15px;">Smart Campus Portal</p>
        </div>
        <div class="form-panel">
            <h2 style="font-size: 32px; font-weight: 800; color: #0f172a; margin-bottom: 40px;">Welcome Back</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label>University Email</label>
                    <input type="email" id="email" placeholder="student@university.edu" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="login-btn">Access Dashboard</button>
            </form>
            <div class="footer-links">
                <a href="Registration Page.html" style="color: #FF6B00;">Don't have an account? Register</a>
            </div>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        const firebaseConfig = { apiKey: "AIzaSyBogJqcO9IifIIQrgS7iDQeYPF22XtXnEc", authDomain: "student-attendance-syste-36412.firebaseapp.com", projectId: "student-attendance-syste-36412", storageBucket: "student-attendance-syste-36412.firebasestorage.app", messagingSenderId: "183007048528", appId: "1:183007048528:web:5bcade6da140f369013255", measurementId: "G-RXGBW49ZB3" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value)
                .then(() => window.location.href = "Dashboard.html")
                .catch((err) => alert("Login Failed: " + err.message));
        });
    </script>
</body>
</html>
