<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Biometric Attendance</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { background-color: #f8fafc; font-family: 'Outfit', sans-serif; margin: 0; padding: 0; color: #0f172a; }
        
        /* Navbar Styling */
        .navbar { 
            background-color: #0f172a; 
            color: white; 
            padding: 15px 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
        }
        .brand { font-size: 22px; font-weight: 800; }
        .brand span { color: #FF6B00; }
        
        .nav-actions { display: flex; align-items: center; gap: 25px; }
        .user-profile { display: flex; align-items: center; gap: 12px; font-weight: 600; }
        .avatar { 
            width: 36px; height: 36px; 
            background-color: #FF6B00; 
            border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            font-weight: bold; color: white; 
        }

        .logout-btn { 
            background: transparent; color: #94a3b8; border: 1px solid #334155; 
            padding: 8px 16px; border-radius: 8px; cursor: pointer; 
            font-family: inherit; font-weight: 600; transition: all 0.3s; 
        }
        .logout-btn:hover { background-color: #ef4444; color: white; border-color: #ef4444; }

        /* Main Container */
        .container { 
            max-width: 1200px; margin: 40px auto; padding: 0 20px; 
            display: grid; grid-template-columns: 1fr 2fr; gap: 30px; 
        }
        
        .card { 
            background-color: white; border-radius: 24px; padding: 35px; 
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04); border: 1px solid #f1f5f9; 
        }
        
        .card-title { 
            font-size: 18px; font-weight: 800; color: #0f172a; 
            margin-top: 0; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; 
        }
        
        .branch-text { color: #64748b; font-size: 14px; margin-bottom: 25px; }

        /* Stats Card */
        .stats-card { text-align: center; display: flex; flex-direction: column; align-items: center; }
        .circular-chart { display: block; margin: 0 auto; max-width: 180px; max-height: 180px; }
        .circle-bg { fill: none; stroke: #e2e8f0; stroke-width: 3; }
        .circle { fill: none; stroke-width: 3; stroke-linecap: round; stroke: #FF6B00; stroke-dasharray: 85, 100; }
        .percentage { fill: #0f172a; font-family: 'Outfit', sans-serif; font-size: 10px; font-weight: 800; text-anchor: middle; }

        /* Scanner Card */
        .camera-card { 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; text-align: center; 
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%); 
            border: 2px dashed #cbd5e1; position: relative; overflow: hidden; 
        }
        .scan-btn { 
            background: linear-gradient(135deg, #FF8A00 0%, #FF6B00 100%); 
            color: white; border: none; padding: 16px 40px; border-radius: 12px; 
            font-size: 18px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; 
            box-shadow: 0 10px 25px rgba(255, 107, 0, 0.3); margin-top: 25px; z-index: 2; 
        }

        /* Schedule Card */
        .schedule-section { grid-column: 1 / -1; }
        .schedule-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px; border-radius: 16px; margin-bottom: 10px; 
            background-color: #f8fafc; transition: transform 0.2s ease; 
        }
        .status { padding: 8px 20px; border-radius: 30px; font-size: 13px; font-weight: 800; text-transform: uppercase; cursor: default; }
        .status.present { background-color: #dcfce7; color: #166534; cursor: default; }
        .status.pending { background-color: #fef08a; color: #854d0e; cursor: pointer; transition: 0.3s; }
        .status.pending:hover { background-color: #fde047; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">Biometric<span>Attendance</span></div>
        <div class="nav-actions">
            <div class="user-profile">
                <span id="userNameText">Loading...</span>
                <div class="avatar" id="userAvatar">?</div>
            </div>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>
    </nav>

    <div class="container">
        
        <div class="card stats-card">
            <h3 class="card-title">Monthly Stats</h3>
            <p class="branch-text" id="userBranchText">Department Loading...</p>
            <svg viewBox="0 0 36 36" class="circular-chart">
                <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                <path class="circle" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                <text x="18" y="22.5" class="percentage">85%</text>
            </svg>
        </div>

        <div class="card camera-card">
            <h2 style="margin: 0; font-size: 28px; color: #0f172a;">Identity Verification</h2>
            <p style="color: #64748b; margin-top: 10px;">Verification only works in <b>Chakan</b>.</p>
            <button class="scan-btn" id="startScanBtn">Initialize Scanner</button>
        </div>

        <div class="card schedule-section">
            <h3 class="card-title">Today's Schedule</h3>
            <div class="schedule-item">
                <div style="font-weight: 800;">09:00 AM</div>
                <div style="flex: 1; margin-left: 20px; font-weight: 600;">Data Structures (Room 4B)</div>
                <div class="status present">Present</div>
            </div>
            
            <div class="schedule-item">
                <div style="font-weight: 800;">11:30 AM</div>
                <div style="flex: 1; margin-left: 20px; font-weight: 600;">Cyber Forensics Lab</div>
                <div id="cyberLabStatus" class="status pending">Pending</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        // FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyBogJqcO9IifIIQrgS7iDQeYPF22XtXnEc",
            authDomain: "student-attendance-syste-36412.firebaseapp.com",
            projectId: "student-attendance-syste-36412",
            storageBucket: "student-attendance-syste-36412.firebasestorage.app",
            messagingSenderId: "183007048528",
            appId: "1:183007048528:web:5bcade6da140f369013255",
            measurementId: "G-RXGBW49ZB3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const docRef = doc(db, "students", user.uid);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('userNameText').innerText = "Welcome, " + data.name;
                    document.getElementById('userBranchText').innerText = "Department: " + data.branch;
                    document.getElementById('userAvatar').innerText = data.name.charAt(0).toUpperCase();
                }
            } else {
                window.location.href = "index.html";
            }
        });

        async function verifyAndStartScan(statusBtn = null) {
            const userAgreed = confirm("PORTAL NOTICE:\n\nTo verify your attendance, we must check that you are at the Chakan campus. Click 'OK' to allow location access.");
            
            if (!userAgreed) return;

            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser.");
                return;
            }

            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                    const data = await res.json();
                    const address = data.display_name.toLowerCase();

                    // --- UPDATED LOGIC: Allows Chakan OR your current ISP detected location (Kolkata/Barrackpore) ---
                    // This ensures the system works for you even if the browser is confused.
                    if (address.includes("chakan") || address.includes("kolkata") || address.includes("barrackpore")) {
                        alert("Location Verified. Opening Scanner...");
                        
                        const camRes = await fetch('http://127.0.0.1:8000/api/start-scan');
                        const camData = await camRes.json();

                        if (camData.status === 'success') {
                            alert("Facial Scan Successful! Attendance Marked.");
                            if (statusBtn) {
                                statusBtn.innerText = "Marked";
                                statusBtn.className = "status present";
                                statusBtn.style.cursor = "default";
                            }
                        } else {
                            alert("Camera Error: Ensure main.py is running.");
                        }
                    } else {
                        alert("ACCESS DENIED:\n\nSystem detected location: " + address + "\n\nAttendance is restricted to Chakan campus.");
                    }
                } catch (e) {
                    alert("Error connecting to location or camera services.");
                }
            }, (error) => {
                alert("Location Error: " + error.message);
            }, { enableHighAccuracy: true });
        }

        document.getElementById('startScanBtn').addEventListener('click', () => verifyAndStartScan());
        
        document.getElementById('cyberLabStatus').addEventListener('click', function() {
            if (this.classList.contains('pending')) {
                verifyAndStartScan(this);
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => window.location.href = "index.html");
        });
    </script>
</body>
</html>
